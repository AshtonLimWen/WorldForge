<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldForge</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="start-screen">
        <div class="panel">
          <h1>WorldForge</h1>
          <p class="subtitle">A living civilization simulator</p>

          <label class="field">
            <span>World Size</span>
            <select id="world-size">
              <option value="100">100 × 100 (Tiny)</option>
              <option value="200" selected>200 × 200 (Small)</option>
              <option value="400">400 × 400 (Medium)</option>
              <option value="600">600 × 600 (Large)</option>
            </select>
          </label>

          <label class="field">
            <span>Seed</span>
            <input id="seed" type="text" placeholder="random" autocomplete="off" />
          </label>

          <button id="generate">Generate World</button>
        </div>
      </div>

      <div id="hud" class="hidden">
        <div id="hud-info">—</div>
        <div id="hud-coords">—</div>
        <button id="new-world">New World</button>
      </div>

      <div id="overlay-panel" class="hidden">
        <div class="panel-title">Map Overlay</div>
        <select id="overlay-select">
          <optgroup label="Terrain">
            <option value="terrain" selected>Terrain</option>
            <option value="biome">Biome</option>
            <option value="water">Water</option>
          </optgroup>
          <optgroup label="Climate">
            <option value="elevation">Elevation</option>
            <option value="temperature">Temperature</option>
            <option value="rainfall">Rainfall</option>
            <option value="humidity">Humidity</option>
          </optgroup>
          <optgroup label="Soil &amp; Vegetation">
            <option value="soil">Soil Fertility</option>
            <option value="vegetation">Vegetation</option>
          </optgroup>
          <optgroup label="Resources">
            <option value="resources">Resources (All)</option>
            <!-- Filled dynamically -->
          </optgroup>
        </select>
      </div>

      <div id="inspector" class="hidden">
        <div class="inspector-header">
          <span id="inspector-title">Tile</span>
          <button id="inspector-close">×</button>
        </div>
        <div id="inspector-body"></div>
      </div>

      <div id="loading" class="hidden"><div class="spinner"></div><div>Generating world…</div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
